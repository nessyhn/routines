<!DOCTYPE html>
<html lang="tr" data-theme="obsidian">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Sayfa Bulunamadı | Routines</title>
  <meta name="robots" content="noindex, follow">
  
  <!-- Theme & Browser UI -->
  <meta name="theme-color" content="#06080e">
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">

  <!-- CSS Dosyaları -->
  <link rel="stylesheet" href="/static/css/style.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, #141a29 0%, #06080e 90%);
      color: #f8fafc;
      padding: 2rem;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }

    .error-hero-box {
      max-width: 540px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      animation: heroSoftFade 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .error-minimal-icon {
      font-size: 1.5rem;
      color: #94a3b8;
      opacity: 0.7;
      letter-spacing: 0.25em;
    }

    .error-code-title {
      font-size: clamp(4.5rem, 12vw, 6.5rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 40%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.25rem;
    }

    .error-heading {
      font-size: 1.4rem;
      font-weight: 500;
      color: #f1f5f9;
      letter-spacing: -0.01em;
    }

    .error-subtitle {
      font-size: 0.95rem;
      color: #64748b;
      max-width: 440px;
      line-height: 1.65;
      font-weight: 400;
      margin-bottom: 0.75rem;
    }

    .btn-return-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--btn-primary-bg, #1a233a);
      color: #ffffff;
      border: 1px solid var(--btn-primary-border, rgba(255, 255, 255, 0.14));
      padding: 0.75rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: var(--radius-pill, 9999px);
      text-decoration: none;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .btn-return-home:hover {
      background-color: var(--btn-primary-hover, #243050);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      color: #ffffff;
    }

    .btn-return-home:active {
      transform: translateY(0);
    }

    @keyframes heroSoftFade {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="error-hero-box">
    <div class="error-minimal-icon">✦</div>
    <div class="error-code-title">404</div>
    <h1 class="error-heading">Sayfa Bulunamadı</h1>
    <p class="error-subtitle">
      Aradığınız sayfa taşınmış, silinmiş veya bağlantı adresi değişmiş olabilir. Rutinlerinizi ve ajandanızı yönetmek için ana sayfaya dönebilirsiniz.
    </p>

    <div style="margin-top: 0.5rem;">
      <a href="/" class="btn-return-home">
        Ana Sayfaya / Takvime Geç
      </a>
    </div>
  </div>

</body>
</html>
